# review —— 审查者 profile
#
# 只读判定：验收命令是否通过、证据是否成立、改动是否溢出、信息卫生是否干净。
# 模型刻意与执行侧不同源，避免自己批自己。

model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com/v1

agent:
  max_turns: 80
  reasoning_effort: high

terminal:
  backend: local
  timeout: 300

delegation:
  max_concurrent_children: 0
