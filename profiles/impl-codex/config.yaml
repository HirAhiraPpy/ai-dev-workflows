# impl-codex —— 执行者 profile
#
# 只负责「卡片 → codex 任务书 → 执行 → 验收 → 回写证据」。编码由 codex CLI 完成，
# 因此本 profile 的模型只需承担调度与判断，用便宜档即可。
#
# 占位符由 scripts/bootstrap.sh 用运行环境的值替换；公共仓库不存真实值。
# 工具面（toolsets）请用 `hermes -p impl-codex tools` 交互式确认，不要在此硬编码。

model:
  default: <WORKER_MODEL>
  provider: <WORKER_PROVIDER>
  base_url: <WORKER_BASE_URL>

agent:
  max_turns: 150
  reasoning_effort: high

terminal:
  backend: local
  timeout: 300

delegation:
  max_concurrent_children: 1
  max_iterations: 150
