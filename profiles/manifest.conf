# profile 装配清单 —— scripts/sync.sh 的唯一事实源
#
# 语义：本文件声明「应然」，本机 profile 承载「实然」。sync.sh plan 逐项对比两者，
# apply 把应然写进本机（只写这里声明的键，不碰其它键），capture 把本机有意的偏离
# 收集成候选文本供人工写回。
#
# 取值占位符由环境变量替换（缺省见 scripts/sync.sh）：
#   <WORKER_MODEL> <WORKER_PROVIDER> <WORKER_BASE_URL>
#
# 键名形如 config.<点分路径>；写入一律走 `hermes -p <profile> config set`，
# 不手改 profile 的 config.yaml（那条路径会被 Hermes 自己写，直接编辑容易漂移）。
#
# 不在本清单内的键（例如 _config_version、display.*、各平台段落）视为本机状态，不参与同步。
# 秘密（.env）永不参与同步。

[impl-codex]
soul = profiles/impl-codex/SOUL.md
config.model.default = <WORKER_MODEL>
config.model.provider = <WORKER_PROVIDER>
config.model.base_url = <WORKER_BASE_URL>
config.agent.max_turns = 150
config.agent.reasoning_effort = high
config.terminal.timeout = 300
config.delegation.max_concurrent_children = 1

[review]
soul = profiles/review/SOUL.md
config.model.default = deepseek-flash
config.model.provider = deepseek
config.model.base_url = https://api.deepseek.com/v1
config.agent.max_turns = 80
config.agent.reasoning_effort = high
config.terminal.timeout = 300
config.delegation.max_concurrent_children = 0

[pr-gate]
soul = profiles/pr-gate/SOUL.md
config.model.default = deepseek-flash
config.model.provider = deepseek
config.model.base_url = https://api.deepseek.com/v1
config.agent.max_turns = 80
config.agent.reasoning_effort = high
config.terminal.timeout = 300
config.delegation.max_concurrent_children = 0
