# worker profile 通用非敏感配置片段
# 由 scripts/bootstrap.sh 合入各 profile 的 config.yaml；占位符在 bootstrap 时替换。
# 本文件是公共仓库内容：禁止写令牌、真实主机名、内网地址。

agent:
  max_turns: 150
  reasoning_effort: high

terminal:
  backend: local
  timeout: 300

delegation:
  max_concurrent_children: 1
  max_iterations: 150

kanban:
  # worker 不自己派工；审查由独立的 review profile 承担
  review_dispatch: false
  dispatch_in_gateway: false

display:
  tool_progress: all
